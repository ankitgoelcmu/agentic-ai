[project]
name = "async-travel-booking"
version = "0.1.0"
description = "A flight + hotel booking supervisor on Deep Agents async subagents"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.30",
    "langchain-ollama>=1.0.1",
    "langgraph-cli[inmem]>=0.4.0",
    "langgraph-sdk>=0.4.4",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_agents"]
