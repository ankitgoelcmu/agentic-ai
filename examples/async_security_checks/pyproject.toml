[project]
name = "async-security-checks"
version = "0.1.0"
description = "The parallel security-checks pattern rebuilt on Deep Agents async subagents"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.30",          # update_strategy, webhook, notify_parent need 0.7.30+
    "langchain-ollama>=1.0.1",
    "langgraph-cli[inmem]>=0.4.0",  # `langgraph dev` local Agent Server
    "langgraph-sdk>=0.4.4",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.4.0"]
openai = ["langchain-openai>=1.1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["security_agents"]
