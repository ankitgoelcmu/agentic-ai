[project]
name = "agentic-ai"
version = "0.1.0"
description = "Agentic AI patterns and examples using LangChain, DeepAgents, and more"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.3",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-experimental>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.10",
    "langgraph>=1.2.1",
    "tavily-python>=0.7.24",
    "pyyaml>=6.0",
    "pysigma>=0.11.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
